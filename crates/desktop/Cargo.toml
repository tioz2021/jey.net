[package]
name = "jey-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri shell for the jey.net desktop client"

[lib]
name = "jey_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "jey-desktop"
path = "src/main.rs"
required-features = ["tauri"]

[features]
default = []
tauri = ["dep:tauri", "dep:tauri-build"]

[dependencies]
jey-core = { path = "../core" }
uuid.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", optional = true , features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
jey-repo-contract = { path = "../repo-contract" }
tokio = { version = "1", features = ["macros", "rt"] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
