[package]
name = "jey-api"
default-run = "jey-api"
description = "HTTP API for the jey.net portal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jey-core = { path = "../core" }

argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
dotenvy = "0.15"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono", "json", "uuid"] }
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid.workspace = true
base64 = "0.22.1"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3.1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
