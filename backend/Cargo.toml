[package]
name = "jey-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP API for the jey.net portal"
license = "UNLICENSED"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
