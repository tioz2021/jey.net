<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jey.net — личный каталог</title>
    <meta name="description" content="Фильмы, сериалы, книги, игры и аниме в одном личном каталоге." />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="jey.net" />
    <meta property="og:title" content="jey.net — личный каталог" />
    <meta property="og:description" content="Фильмы, сериалы, книги, игры и аниме в одном личном каталоге." />
    <meta property="og:image" content="/og.png" />
  </head>
  <body>
    <script>
      try {
        var stored = localStorage.getItem("jey-theme");
        var theme = stored === "light" || stored === "dark" ? stored : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
