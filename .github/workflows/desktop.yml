name: desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libwayland-dev libxkbcommon-dev librsvg2-dev patchelf pkg-config libdbus-1-dev
      - name: Check version
        run: bash scripts/check-version.sh
      - name: Build SPA
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Build AppImage and deb
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop
          args: --features tauri --bundles appimage,deb
      - name: Checksums
        run: |
          cd target/release/bundle
          find appimage deb -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jey-desktop-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer (unsigned)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check version
        run: bash scripts/check-version.sh
        shell: bash
      - name: Build SPA
        working-directory: apps/web
        run: npm ci; npm run build
      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop
          args: --features tauri --bundles nsis
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe
          $lines = foreach ($file in $files) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          $lines | Set-Content target/release/bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jey-desktop-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
