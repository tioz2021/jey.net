name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgres://jey:jey@localhost:5432/jey
      TEST_DATABASE_URL: postgres://jey:jey@localhost:5432/jey
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.staging/pw-browsers
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jey
          POSTGRES_PASSWORD: jey
          POSTGRES_DB: jey
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Static security/type checks
        run: |
          bash scripts/check-csp.sh
          bash scripts/check-silent-catches.sh
          bash scripts/generate-types.sh
          git diff --exit-code -- frontend/lib/generated

      - name: Clippy
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets --message-format=json -- -D warnings > /tmp/clippy.json 2> /tmp/clippy.err
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 scripts/clippy-annotations.py /tmp/clippy.json
            cat /tmp/clippy.err
            exit "$status"
          fi

      - name: Frontend tests
        working-directory: apps/web
        run: npm test

      - name: Frontend build
        working-directory: apps/web
        run: npm run build

      - name: Rust tests
        run: |
          rm -rf var/test-media
          cargo test --locked --workspace -- --test-threads=1

      - name: Migrations
        run: cargo run --locked --quiet -p jey-api -- migrate

      - name: Release build
        run: cargo build --locked --release -p jey-api --bin jey-api

      - name: Playwright E2E
        env:
          CHECK_E2E: "1"
        run: bash scripts/e2e.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: bash scripts/security-audit.sh
