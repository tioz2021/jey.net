name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libwayland-dev libxkbcommon-dev librsvg2-dev patchelf pkg-config libdbus-1-dev
      - name: Check release version
        run: bash scripts/check-version.sh
      - name: Build SPA
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Build AppImage and deb
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/desktop
          args: --features tauri --bundles appimage,deb
      - name: Checksums
        run: |
          cd target/release/bundle
          find appimage deb -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows installer (unsigned)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check release version
        run: bash scripts/check-version.sh
        shell: bash
      - name: Build SPA
        working-directory: apps/web
        run: npm ci; npm run build
      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/desktop
          args: --features tauri --bundles nsis
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe
          $lines = foreach ($file in $files) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          $lines | Set-Content target/release/bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  vps:
    name: Publish VPS download channel
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    timeout-minutes: 20
    env:
      VERSION: ${{ github.ref_name }}
      ARTIFACTS_DIR: release-assets
      REQUIRE_WINDOWS: "1"
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ~/.ssh/jey_vps
      NOTES: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/jey_vps
          chmod 600 ~/.ssh/jey_vps
      - name: Publish to VPS
        run: bash scripts/publish-desktop.sh

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp -v {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          files = sorted(p.name for p in pathlib.Path('.').iterdir() if p.is_file())
          version = os.environ.get('GITHUB_REF_NAME', '').lstrip('v')
          manifest = {
              'version': version,
              'commit': os.environ.get('GITHUB_SHA', ''),
              'files': files,
          }
          pathlib.Path('release.json').write_text(json.dumps(manifest, indent=2))
          PY
          sha256sum -c SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
