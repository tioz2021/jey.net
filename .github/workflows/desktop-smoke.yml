name: desktop-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    name: WebKit desktop smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev \
            libwayland-dev libxkbcommon-dev librsvg2-dev patchelf \
            pkg-config libdbus-1-dev webkit2gtk-driver xvfb
      - name: Install tauri-driver
        run: cargo install tauri-driver --version '^2' --locked
      - name: Build SPA and desktop binary
        run: |
          cd apps/web
          npm ci --no-audit --no-fund
          npm run build
          cd ../..
          cargo build --release -p jey-desktop --features tauri
      - name: Run WebKit smoke suite
        run: xvfb-run -a bash scripts/desktop-smoke.sh
