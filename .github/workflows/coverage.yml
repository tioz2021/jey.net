name: coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend coverage ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - working-directory: apps/web
        run: npm run test:coverage
      - run: bash scripts/check-coverage.sh

  rust:
    name: Rust coverage ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jey
          POSTGRES_PASSWORD: jey
          POSTGRES_DB: jey
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://jey:jey@localhost:5432/jey
      TEST_DATABASE_URL: postgres://jey:jey@localhost:5432/jey
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev \
            libwayland-dev libxkbcommon-dev librsvg2-dev patchelf \
            pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run instrumented tests
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info -- --test-threads=1
      - name: Coverage ratchet
        run: bash scripts/check-rust-coverage.sh
